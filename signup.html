<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up — LabelSetu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob-field">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
<div class="noise-overlay"></div>

<nav class="navbar">
  <div class="brand">LabelSetu<sup>®</sup></div>
</nav>

<div class="page">
  <div class="float-card c1"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c2"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c3"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c4"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>

  <div class="container">
    <p class="eyebrow">Label compliance, made visible</p>
    <div class="card">
      <h1>Create an account</h1>
      <p class="subtitle">Sign up to start checking product labels.</p>

      <form id="signupForm">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required>

        <p class="error-text" id="errorText" style="display:none;"></p>

        <button type="submit" class="primary">Create account</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.getElementById("signupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("errorText");

    if (password.length < 6) {
      errorEl.textContent = "Password must be at least 6 characters.";
      errorEl.style.display = "block";
      return;
    }

    const result = mockSignup(name, email, password);
    if (!result.ok) {
      errorEl.textContent = result.error;
      errorEl.style.display = "block";
      return;
    }

    window.location.href = "upload.html";
  });
</script>
</body>
</html>
