<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — LabelSetu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob-field">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>
<div class="noise-overlay"></div>

<nav class="navbar">
  <div class="brand">LabelSetu<sup>®</sup></div>
</nav>

<div class="page">
  <div class="float-card c1"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c2"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c3"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>
  <div class="float-card c4"><span class="fc-line l1"></span><span class="fc-line l2"></span></div>

  <div class="container">
    <p class="eyebrow">Label compliance, made visible</p>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to continue checking labels.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>

        <p class="error-text" id="errorText" style="display:none;"></p>

        <button type="submit" class="primary">Log in</button>
      </form>

      <p class="form-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("errorText");

    const result = mockLogin(email, password);
    if (!result.ok) {
      errorEl.textContent = result.error;
      errorEl.style.display = "block";
      return;
    }

    window.location.href = "upload.html";
  });
</script>
</body>
</html>
